[tool.poetry]
name = "deploydocus"
version = "0.0.1a1"
description = "A library and CLI to install/uninstall Kubernetes applications to clusters."
authors = ["Partho Bhowmick <partho.bhowmick@icloud.com>"]
readme = "README.md"
packages = [{include = "deploydocus", from = "src"}]
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[tool.poetry.dependencies]
python = "^3.12"
kubernetes = "^32.0.0"
pydantic-settings = "^2.3"
pyyaml = {extras = ["libyaml"], version = "^6.0"}
types-pyyaml = "^6.0"
plumbum = "^1.8"
pydantic = "^2.8"
typer = "^0.15"
tinydb = "^4.8"
poetry = "^2.0.1"


[tool.poetry.group.dev.dependencies]
ipython = "^8.30.0"
pytest = "^8.3.4"
mypy = "^1.14.1"
isort = "^6.0.0"
flake8 = "^7.1.1"
cython = "^3.0.11"
wheel = "^0.45.1"
camel-converter = "^3.1"
black = "^24.10.0"
flake8-pydantic = "^0.3.1"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.1"
mkdocs = "^1.6"
mkdocs-material = "^9.5"

[tool.poetry.scripts]
deploydocus = "deploydocus.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312", "py313"]

[tool.isort]
profile = "black"

